<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title th:text="${lesson.getTitle(locale)} + ' — Easy Java'">Урок — Easy Java</title>
    <link href="/assets/css/bvi.min.css" rel="stylesheet">
    <style>
        :root { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.6); --glass-border:rgba(255,255,255,.85); --accent:#f89820; --code-bg:#0f172a; --code-text:#e2e8f0; --scroll-thumb: rgba(248,152,32,.5); --scroll-thumb-hover: rgba(248,152,32,.85); }
        @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.5); --glass-border:rgba(255,255,255,.08); --code-bg:#020617; --code-text:#e2e8f0; --scroll-thumb: rgba(248,152,32,.45); --scroll-thumb-hover: rgba(248,152,32,.85); } }
        [data-theme="light"] { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.7); --glass-border:rgba(255,255,255,.9); --code-bg:#0f172a; --code-text:#e2e8f0; }
        [data-theme="dark"]  { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.65); --glass-border:rgba(255,255,255,.1); --code-bg:#020617; --code-text:#e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; transition: background .3s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px;
            background-image: radial-gradient(circle at 10% 10%, rgba(248,152,32,.10), transparent 40%),
                              radial-gradient(circle at 90% 90%, rgba(83,130,161,.12), transparent 45%);
        }
        .wrap { max-width: 780px; margin: 0 auto; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .logo { font-weight: 800; }
        .logo a { color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .controls { display: flex; gap: 10px; }
        .theme-toggle, .bvi-toggle { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 1.15rem; color: var(--text); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
        .theme-toggle:hover, .bvi-toggle:hover { transform: translateY(-2px); }

        .back { display: inline-block; color: var(--muted); text-decoration: none; font-size: .9rem; margin-bottom: 16px; }
        .back:hover { color: var(--accent); }

        article {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 40px; line-height: 1.75;
        }
        article .emoji-head { font-size: 2.4rem; display: block; margin-bottom: 12px; }
        article h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -.8px; margin-bottom: 8px; }
        article .sub { color: var(--muted); margin-bottom: 32px; font-size: 1rem; }
        article h3 { font-size: 1.15rem; margin: 28px 0 12px; letter-spacing: -.3px; }
        article p { margin-bottom: 14px; }
        article ul, article ol { margin: 0 0 16px 22px; }
        article li { margin-bottom: 6px; }
        article blockquote {
            border-left: 3px solid var(--accent);
            padding: 12px 20px; margin: 20px 0;
            background: rgba(248,152,32,.06);
            border-radius: 0 12px 12px 0;
            font-style: italic; color: var(--text);
        }
        article .lead { font-size: 1.1rem; color: var(--text); font-weight: 500; }
        article code { background: rgba(148,163,184,.2); padding: 2px 6px; border-radius: 5px; font-family: Consolas, Monaco, monospace; font-size: .92em; }
        article pre {
            background: var(--code-bg); color: var(--code-text);
            padding: 18px 22px; border-radius: 14px;
            overflow-x: auto; margin: 16px 0;
            font-family: Consolas, Monaco, monospace;
            font-size: .9rem; line-height: 1.6;
            border: 1px solid rgba(255,255,255,.05);
        }
        article pre code { background: none; padding: 0; color: inherit; }

        .nav-bottom { display: flex; justify-content: center; margin-top: 32px; }
        .nav-bottom a { color: var(--accent); text-decoration: none; font-weight: 600; }

        footer { margin-top: 40px; display: flex; gap: 15px; justify-content: center; }
        footer img { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; opacity: .35; transition: opacity .3s, transform .3s; }
        footer img:hover { opacity: 1; transform: translateY(-2px); }
        footer a.active img { opacity: 1; }

        @media (max-width: 480px) {
            article { padding: 24px; border-radius: 18px; }
            article pre { padding: 14px 16px; font-size: .82rem; }
        }
    </style>
</head>
<body>
    <div class="wrap bvi-speech">
        <div class="top">
            <div class="logo"><a href="/">easy<span>java</span></a></div>
            <div class="controls">
                <button class="bvi-toggle bvi-open" title="Версия для слабовидящих">👁️</button>
                <button class="theme-toggle" id="theme-toggle">🌓</button>
            </div>
        </div>

        <a href="/guide" class="back">← Все уроки</a>

        <article>
            <span class="emoji-head" th:text="${lesson.emoji()}">☕</span>
            <h1 th:text="${lesson.getTitle(locale)}">Название</h1>
            <p class="sub" th:text="${lesson.getSubtitle(locale)}">Подзаголовок</p>

            <div th:utext="${lesson.getContent(locale)}">Контент урока</div>
        </article>

        <div class="nav-bottom">
            <a href="/guide">← Вернуться к списку уроков</a>
        </div>

        <footer>
			<a href="/" th:classappend="${currentLang == 'ru' ? 'active' : ''}"><img src="/assets/lang/ru.png" alt="Русский"></a>
			<a href="/en" th:classappend="${currentLang == 'en' ? 'active' : ''}"><img src="/assets/lang/us.png" alt="English"></a>
			<a href="/uk" th:classappend="${currentLang == 'uk' ? 'active' : ''}"><img src="/assets/lang/uk.png" alt="Українська"></a>
			<a href="/zh-CN" th:classappend="${currentLang == 'zh-CN' ? 'active' : ''}"><img src="/assets/lang/cn.png" alt="简体中文"></a>
			<a href="/zh-TW" th:classappend="${currentLang == 'zh-TW' ? 'active' : ''}"><img src="/assets/lang/tw.png" alt="繁體中文"></a>
		</footer>
    </div>

    <script src="/assets/js/lenis.min.js"></script>
	<script src="/assets/js/lenis-init.min.js"></script>
	<script src="/assets/js/bvi.min.js"></script>
    <script>
        new isvek.Bvi({ target: '.bvi-open', fontSize: 20, theme: 'white', images: true, speech: true, speechPanel: true, panelFixed: true });
        const t = document.getElementById('theme-toggle');
        const h = document.documentElement;
        let cur = localStorage.getItem('theme') || 'system';
        function apply(x){ if(x==='dark') h.setAttribute('data-theme','dark'); else if(x==='light') h.setAttribute('data-theme','light'); else h.removeAttribute('data-theme'); }
        apply(cur);
        t.addEventListener('click',()=>{ cur = cur==='system'?'light':cur==='light'?'dark':'system'; localStorage.setItem('theme',cur); apply(cur); });
    </script>
</body>
</html>
