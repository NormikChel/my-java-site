<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Гайд — Easy Java</title>
    <link href="/css/bvi.min.css" rel="stylesheet">
    <style>
        :root { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.55); --glass-border:rgba(255,255,255,.8); --accent:#f89820; --scroll-thumb: rgba(248,152,32,.5); --scroll-thumb-hover: rgba(248,152,32,.85); }
        @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.45); --glass-border:rgba(255,255,255,.08); --scroll-thumb: rgba(248,152,32,.45); --scroll-thumb-hover: rgba(248,152,32,.85); } }
        [data-theme="light"] { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.65); --glass-border:rgba(255,255,255,.9); }
        [data-theme="dark"]  { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.6); --glass-border:rgba(255,255,255,.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; transition: background .3s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px;
            background-image: radial-gradient(circle at 10% 10%, rgba(248,152,32,.12), transparent 40%),
                              radial-gradient(circle at 90% 90%, rgba(83,130,161,.14), transparent 45%);
        }
        .wrap { max-width: 860px; margin: 0 auto; }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .logo { font-weight: 800; letter-spacing: -.5px; }
        .logo a { color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent); }
        .controls { display: flex; gap: 10px; }
        .theme-toggle, .bvi-toggle { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 1.15rem; color: var(--text); display: flex; align-items: center; justify-content: center; transition: transform .2s; }
        .theme-toggle:hover, .bvi-toggle:hover { transform: translateY(-2px); }

        h1.title { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
        p.subtitle { color: var(--muted); font-size: 1.05rem; margin-bottom: 32px; }

        .lesson-card {
            display: flex; align-items: center; gap: 18px;
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 20px 24px; margin-bottom: 14px;
            text-decoration: none; color: var(--text);
            transition: transform .2s, box-shadow .2s;
        }
        .lesson-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
        .lesson-emoji { font-size: 1.8rem; flex-shrink: 0; }
        .lesson-info h3 { font-size: 1.05rem; margin-bottom: 4px; }
        .lesson-info p { font-size: .9rem; color: var(--muted); }

        footer { margin-top: 40px; display: flex; gap: 15px; justify-content: center; }
        footer img { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; opacity: .35; transition: opacity .3s, transform .3s; }
        footer img:hover { opacity: 1; transform: translateY(-2px); }
        footer a.active img { opacity: 1; }
    </style>
</head>
<body>
    <div class="wrap bvi-speech">
        <div class="top">
            <div class="logo"><a href="/">easy<span>java</span></a></div>
            <div class="controls">
                <button class="bvi-toggle bvi-open" title="Версия для слабовидящих">👁️</button>
                <button class="theme-toggle" id="theme-toggle">🌓</button>
            </div>
        </div>

        <h1 class="title">Гайд для тех, кто боится Java</h1>
        <p class="subtitle">8 уроков. Никакой бюрократии. Только код и кайф.</p>

        <a th:each="l : ${lessons}" th:href="@{/guide/{slug}(slug=${l.slug()})}" class="lesson-card">
            <span class="lesson-emoji" th:text="${l.emoji()}">☕</span>
            <div class="lesson-info">
                <h3 th:text="${l.getTitle(locale)}">Название урока</h3>
                <p th:text="${l.getSubtitle(locale)}">Подзаголовок</p>
            </div>
        </a>

        <footer>
            <a href="/" th:classappend="${currentLang == 'ru' ? 'active' : ''}"><img src="/assets/lang/ru.png" alt="Русский"></a>
            <a href="/en" th:classappend="${currentLang == 'en' ? 'active' : ''}"><img src="/assets/lang/us.png" alt="English"></a>
            <a href="/zh-CN" th:classappend="${currentLang == 'zh-CN' ? 'active' : ''}"><img src="/assets/lang/cn.png" alt="简体中文"></a>
            <a href="/zh-TW" th:classappend="${currentLang == 'zh-TW' ? 'active' : ''}"><img src="/assets/lang/tw.png" alt="繁體中文"></a>
        </footer>
    </div>

    <script src="/js/lenis.min.js"></script>
    <script src="/js/lenis-init.min.js"></script>
    <script src="/js/bvi.min.js"></script>
    <script>
        new isvek.Bvi({ target: '.bvi-open', fontSize: 140, theme: 'white', images: true, speech: true, speechPanel: true, panelFixed: true });
        const t = document.getElementById('theme-toggle');
        const h = document.documentElement;
        let cur = localStorage.getItem('theme') || 'system';
        function apply(x){ if(x==='dark') h.setAttribute('data-theme','dark'); else if(x==='light') h.setAttribute('data-theme','light'); else h.removeAttribute('data-theme'); }
        apply(cur);
        t.addEventListener('click',()=>{ cur = cur==='system'?'light':cur==='light'?'dark':'system'; localStorage.setItem('theme',cur); apply(cur); });
    </script>
</body>
</html>
