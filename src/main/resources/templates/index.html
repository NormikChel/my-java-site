<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:with="langPrefix=${currentLang == 'ru' ? '' : '/' + currentLang},
               flagSuffix=${(pathSuffix == null || pathSuffix == '/' || pathSuffix == '') ? '' : pathSuffix}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Easy Java — сайт для тех, кто хочет выучить Java без страха и боли.">
    <meta name="keywords" content="Java, программирование, обучение, Spring Boot, easy java">
    <meta property="og:title" content="Easy Java — Java с кайфом">
    <meta property="og:description" content="Хватит бояться Java. Заходи, тут всё просто.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://easyjava.relaxdev.ru/">
    <meta name="twitter:card" content="summary_large_image">
    <title>Easy Java — Java с кайфом</title>

    <link href="/assets/css/bvi.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f6fb;
            --text: #0f172a;
            --muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.8);
            --accent: #f89820;
            --scroll-thumb: rgba(248, 152, 32, 0.5);
            --scroll-thumb-hover: rgba(248, 152, 32, 0.85);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1120;
                --text: #e2e8f0;
                --muted: #94a3b8;
                --glass-bg: rgba(30, 41, 59, 0.45);
                --glass-border: rgba(255, 255, 255, 0.08);
                --scroll-thumb: rgba(248, 152, 32, 0.45);
                --scroll-thumb-hover: rgba(248, 152, 32, 0.85);
            }
        }
        [data-theme="light"] { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg: rgba(255,255,255,0.65); --glass-border: rgba(255,255,255,0.9); }
        [data-theme="dark"]  { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg: rgba(30,41,59,0.6); --glass-border: rgba(255,255,255,0.1); }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color .3s ease, color .3s ease; }

        html { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
            transition: background .3s;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(248,152,32,.12), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(83,130,161,.14), transparent 45%);
        }

        .wrap { width: 100%; max-width: 860px; }

        header.top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .logo { font-weight: 800; letter-spacing: -0.5px; font-size: 1.15rem; }
        .logo span { color: var(--accent); }

        .controls { display: flex; gap: 10px; align-items: center; }
        .theme-toggle, .bvi-toggle {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            width: 44px; height: 44px;
            cursor: pointer; font-size: 1.15rem;
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            transition: transform .2s;
        }
        .theme-toggle:hover, .bvi-toggle:hover { transform: translateY(-2px); }

        .hero {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 56px 40px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,.08);
            animation: fadeUp .8s ease-out;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .hero h1 em { color: var(--accent); font-style: normal; }
        .hero p {
            font-size: 1.15rem;
            color: var(--muted);
            line-height: 1.6;
            max-width: 620px;
            margin: 0 auto 32px;
        }

        .cta {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 16px 36px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(248,152,32,.4);
            transition: transform .2s, box-shadow .2s;
        }
        .cta:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(248,152,32,.55); }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 28px;
        }
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            transition: transform .25s;
        }
        .card:hover { transform: translateY(-4px); }
        .card .emoji { font-size: 1.8rem; display: block; margin-bottom: 12px; }
        .card h3 { font-size: 1rem; margin-bottom: 8px; letter-spacing: -0.2px; }
        .card p { font-size: .9rem; color: var(--muted); line-height: 1.5; }

        footer {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        footer img {
            width: 30px; height: 30px;
            border-radius: 50%;
            cursor: pointer;
            opacity: .35;
            object-fit: cover;
            transition: opacity .3s ease, transform .3s ease;
        }
        footer img:hover { opacity: 1; transform: translateY(-2px); }
        footer a.active img { opacity: 1; }

        @keyframes fadeUp { from { opacity:0; transform: translateY(24px);} to {opacity:1; transform:translateY(0);} }

        @media (max-width: 480px) {
            .hero { padding: 36px 20px; border-radius: 22px; }
            .cta { width: 100%; }
            .theme-toggle, .bvi-toggle { width: 40px; height: 40px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="wrap bvi-speech">
        <header class="top">
            <div class="logo">easy<span>java</span></div>
            <div class="controls">
                <button class="bvi-toggle bvi-open" id="bvi-toggle" title="Версия для слабовидящих">👁️</button>
                <button class="theme-toggle" id="theme-toggle" title="Сменить тему">🌓</button>
            </div>
        </header>

        <section class="hero">
            <h1 th:utext="#{hero.title}">Java — это <em>кайф</em>.<br>Серьёзно.</h1>
            <p th:text="#{hero.subtitle}">Хватит бояться «сложного энтерпрайзного языка».</p>
            <a th:href="@{${langPrefix} + '/guide'}" class="cta" th:text="#{guide.open}">Открыть гайд →</a>
        </section>

        <div class="cards">
            <div class="card">
                <span class="emoji">🧠</span>
                <h3 th:text="#{hero.card1.title}">Без бюрократии</h3>
                <p th:text="#{hero.card1.text}">Никаких «сначала прочитай 600 страниц спецификации».</p>
            </div>
            <div class="card">
                <span class="emoji">⚡</span>
                <h3 th:text="#{hero.card2.title}">Быстрый старт</h3>
                <p th:text="#{hero.card2.text}">Первая программа — за 10 секунд.</p>
            </div>
            <div class="card">
                <span class="emoji">💼</span>
                <h3 th:text="#{hero.card3.title}">Реальная работа</h3>
                <p th:text="#{hero.card3.text}">Вакансий на Java больше, чем на любом другом языке.</p>
            </div>
        </div>

        <footer>
            <a th:href="@{${flagSuffix == '' ? '/' : flagSuffix}}" th:classappend="${currentLang == 'ru' ? 'active' : ''}"><img src="/assets/lang/ru.png" alt="Русский"></a>
            <a th:href="@{'/en' + ${flagSuffix}}" th:classappend="${currentLang == 'en' ? 'active' : ''}"><img src="/assets/lang/us.png" alt="English"></a>
            <a th:href="@{'/uk' + ${flagSuffix}}" th:classappend="${currentLang == 'uk' ? 'active' : ''}"><img src="/assets/lang/ua.png" alt="Українська"></a>
            <a th:href="@{'/zh-CN' + ${flagSuffix}}" th:classappend="${currentLang == 'zh-CN' ? 'active' : ''}"><img src="/assets/lang/cn.png" alt="简体中文"></a>
            <a th:href="@{'/zh-TW' + ${flagSuffix}}" th:classappend="${currentLang == 'zh-TW' ? 'active' : ''}"><img src="/assets/lang/tw.png" alt="繁體中文"></a>
        </footer>
    </div>

    <script src="/assets/js/lenis.min.js"></script>
    <script src="/assets/js/lenis-init.min.js"></script>
    <script src="/assets/js/bvi.min.js"></script>
    <script>
        new isvek.Bvi({
            target: '.bvi-open',
            fontSize: 20,
            theme: 'white',
            images: 'grayscale',
            letterSpacing: 'normal',
            lineHeight: 'normal',
            speech: true,
            fontFamily: 'arial',
            builtElements: false,
            panelFixed: true,
            panelHide: false,
            reload: false,
            lang: 'ru-RU'
        });

        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        let currentTheme = localStorage.getItem('theme') || 'system';
        function applyTheme(t) {
            if (t === 'dark') htmlElement.setAttribute('data-theme','dark');
            else if (t === 'light') htmlElement.setAttribute('data-theme','light');
            else htmlElement.removeAttribute('data-theme');
        }
        applyTheme(currentTheme);
        themeToggle.addEventListener('click', () => {
            if (currentTheme === 'system') currentTheme = 'light';
            else if (currentTheme === 'light') currentTheme = 'dark';
            else currentTheme = 'system';
            localStorage.setItem('theme', currentTheme);
            applyTheme(currentTheme);
        });
    </script>
</body>
</html>
