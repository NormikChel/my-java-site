<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:with="langCode=${#locale.language == 'zh' ? 'zh-' + #locale.country : #locale.language},
               langPrefix=${langCode == 'ru' ? '' : '/' + langCode}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="robots" content="noindex">
    <title th:text="#{error.404.title} + ' — Easy Java'">404 — Easy Java</title>
    <style>
        :root { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.55); --glass-border:rgba(255,255,255,.8); --accent:#f89820; }
        @media (prefers-color-scheme: dark) { :root { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.45); --glass-border:rgba(255,255,255,.08); } }
        [data-theme="light"] { --bg:#f4f6fb; --text:#0f172a; --muted:#64748b; --glass-bg:rgba(255,255,255,.65); --glass-border:rgba(255,255,255,.9); }
        [data-theme="dark"]  { --bg:#0b1120; --text:#e2e8f0; --muted:#94a3b8; --glass-bg:rgba(30,41,59,.6); --glass-border:rgba(255,255,255,.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle at 15% 15%, rgba(248,152,32,.12), transparent 40%),
                              radial-gradient(circle at 85% 80%, rgba(83,130,161,.14), transparent 45%);
        }
        .box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 56px 40px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,.08);
            animation: fadeUp .8s ease-out;
        }
        .code {
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: clamp(1.3rem, 3.5vw, 1.8rem);
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -0.5px;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            box-shadow: 0 8px 24px rgba(248,152,32,.4);
            transition: transform .2s, box-shadow .2s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(248,152,32,.55); }
        @keyframes fadeUp { from { opacity:0; transform: translateY(24px);} to {opacity:1; transform:translateY(0);} }
        @media (max-width: 480px) { .box { padding: 36px 22px; border-radius: 22px; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1 th:text="#{error.404.title}">Страница не найдена</h1>
        <p th:text="#{error.404.text}">Ты забрёл куда-то не туда.</p>
        <a th:href="@{${langPrefix} + '/'}" class="btn" th:text="#{error.404.back}">← На главную</a>
    </div>
</body>
</html>
